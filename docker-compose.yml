version: '3.8'

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medidesk_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./vendor:/var/www/html/vendor
      - ./node_modules:/var/www/html/node_modules
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - medinet
    healthcheck:
      test: ["CMD", "php", "-r", "echo 'PHP OK';"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:stable
    container_name: medidesk_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy
    networks:
      - medinet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  node:
    image: node:22
    container_name: medidesk_node
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ./:/var/www/html
      - ./node_modules:/var/www/html/node_modules
    ports:
      - "5173:5173"
    depends_on:
      php:
        condition: service_healthy
    networks:
      - medinet

  mysql:
    image: mysql:8.0
    container_name: medidesk_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: medidesk
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3317:3306"
    networks:
      - medinet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: medidesk_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    networks:
      - medinet

volumes:
  mysql_data:

networks:
  medinet:
    driver: bridge
